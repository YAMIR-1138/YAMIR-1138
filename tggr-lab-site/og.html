<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og · TGGR Lab</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f5f7f9; --ink: #121c24; --ink-2: #4a5864; --accent: #a8206a; --accent-ink: #7d144f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); }
  .og { position: relative; width: 1200px; height: 630px; padding: 64px 72px; display: grid; grid-template-columns: 1fr 440px; gap: 48px; align-items: center; }
  .eyebrow { font: 500 17px "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
  h1 { font: 700 196px/.86 "Bricolage Grotesque", sans-serif; letter-spacing: -.04em; margin: 18px 0 26px -.04em; }
  p.lede { font: 400 30px/1.35 "Source Serif 4", Georgia, serif; margin: 0; max-width: 21em; }
  p.lede em { color: var(--accent-ink); }
  .strip { position: absolute; left: 72px; right: 72px; bottom: 50px; border-top: 2px solid var(--ink); padding-top: 14px; font: 500 16px "IBM Plex Mono", monospace; color: var(--ink-2); display: flex; justify-content: space-between; }
  svg { width: 440px; height: auto; overflow: visible; }
  svg line, svg polyline { stroke: var(--ink); stroke-width: 1.8; fill: none; }
  svg rect, svg circle { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
  svg .aff { fill: var(--ink); }
  svg .dot { fill: var(--ink); stroke: none; }
  svg .gen { font: 500 12px "IBM Plex Mono", monospace; fill: var(--ink-2); }
  svg .arrow { stroke: var(--accent); stroke-width: 2; } svg .head { fill: var(--accent); stroke: none; }
</style>
</head>
<body>
<div class="og">
  <div>
    <p class="eyebrow">Translational Genetics and Genomics Research</p>
    <h1>TGGR</h1>
    <p class="lede">Gene discovery in families with rare disease, <em>and the open tools we build on the way.</em></p>
  </div>
  <svg viewBox="0 0 360 232" aria-hidden="true">
    <line x1="89" y1="40" x2="141" y2="40"/><line x1="239" y1="40" x2="291" y2="40"/>
    <polyline points="115,40 115,111"/><polyline points="265,40 265,111"/>
    <line x1="124" y1="118" x2="256" y2="118"/><line x1="124" y1="122" x2="256" y2="122"/>
    <polyline points="190,122 190,160"/><line x1="120" y1="160" x2="270" y2="160"/>
    <polyline points="120,160 120,191"/><polyline points="170,160 170,191"/><polyline points="220,160 220,191"/><polyline points="270,160 270,191"/>
    <text class="gen" x="22" y="44">I</text><text class="gen" x="22" y="124">II</text><text class="gen" x="22" y="204">III</text>
    <rect x="71" y="31" width="18" height="18"/><circle class="dot" cx="80" cy="40" r="2.6"/>
    <circle cx="150" cy="40" r="9"/>
    <rect x="221" y="31" width="18" height="18"/>
    <circle cx="300" cy="40" r="9"/><circle class="dot" cx="300" cy="40" r="2.6"/><line x1="290" y1="51" x2="310" y2="29"/>
    <circle cx="115" cy="120" r="9"/><circle class="dot" cx="115" cy="120" r="2.6"/>
    <rect x="256" y="111" width="18" height="18"/><circle class="dot" cx="265" cy="120" r="2.6"/>
    <rect x="111" y="191" width="18" height="18"/>
    <circle class="aff" cx="170" cy="200" r="9"/>
    <rect class="aff" x="211" y="191" width="18" height="18"/>
    <circle cx="270" cy="200" r="9"/><circle class="dot" cx="270" cy="200" r="2.6"/>
    <line class="arrow" x1="146" y1="222" x2="158" y2="210"/><polygon class="head" points="160,208 152,210 158,216"/>
  </svg>
  <p class="strip"><span>Genetics Institute · Tel Aviv Sourasky Medical Center · Tel Aviv University</span><span>tggr-lab.github.io</span></p>
</div>
</body>
</html>
