<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · TGGR Lab</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try { var t = localStorage.getItem('tggr-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
  :root { --paper: #f5f7f9; --ink: #121c24; --ink-2: #4a5864; --rule: #d6dde3; --accent: #a8206a; --accent-ink: #7d144f; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #0f1518; --ink: #e9eef1; --ink-2: #9fadb7; --rule: #26313a; --accent: #e879b8; --accent-ink: #f3a8d2; color-scheme: dark; } }
  :root[data-theme="dark"] { --paper: #0f1518; --ink: #e9eef1; --ink-2: #9fadb7; --rule: #26313a; --accent: #e879b8; --accent-ink: #f3a8d2; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 18px/1.6 "Source Serif 4", Georgia, serif; padding: 24px clamp(16px, 4vw, 48px); }
  main { max-width: 560px; width: 100%; }
  .eyebrow { font: 12px "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--ink); padding-bottom: 12px; margin: 0 0 20px; }
  h1 { font: 700 clamp(88px, 22vw, 160px)/.9 "Bricolage Grotesque", sans-serif; letter-spacing: -.04em; margin: 0 0 18px -.04em; }
  p { margin: 0 0 22px; max-width: 32em; }
  code { font: 500 .85em "IBM Plex Mono", monospace; color: var(--accent-ink); }
  svg { display: block; width: 150px; height: auto; margin-bottom: 8px; overflow: visible; }
  svg rect, svg circle { fill: var(--paper); stroke: var(--ink); stroke-width: 1.8; }
  svg line, svg polyline { stroke: var(--ink); stroke-width: 1.6; fill: none; }
  svg .q { font: 500 10px "IBM Plex Mono", monospace; fill: var(--accent); }
  a { display: inline-block; font: 500 14px "IBM Plex Mono", monospace; color: var(--paper); background: var(--ink); text-decoration: none; padding: 12px 16px; border-radius: 3px; }
  a:hover { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">TGGR Lab · page not found</p>
  <svg viewBox="0 0 150 70" aria-hidden="true">
    <line x1="34" y1="14" x2="86" y2="14"/><polyline points="60,14 60,40"/><line x1="40" y1="40" x2="80" y2="40"/><polyline points="40,40 40,52"/><polyline points="80,40 80,52"/>
    <rect x="25" y="5" width="18" height="18"/><circle cx="95" cy="14" r="9"/>
    <rect x="31" y="52" width="18" height="18"/><circle cx="80" cy="61" r="9"/><text class="q" x="80" y="65" text-anchor="middle">?</text>
  </svg>
  <h1>404</h1>
  <p>No page at <code id="path">this address</code>. It may have moved, or it segregated out of the family.</p>
  <a href="./">Back to the lab</a>
</main>
<script>
  var p = location.pathname.split('/').filter(Boolean).pop();
  if (p) document.getElementById('path').textContent = decodeURIComponent(p).slice(0, 60);
</script>
</body>
</html>
