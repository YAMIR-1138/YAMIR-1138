<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found · TGGR Lab</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/logo-kit/png/lockup-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Atkinson+Hyperlegible+Next:wght@400&family=Atkinson+Hyperlegible+Mono:wght@500&display=swap" rel="stylesheet">
<script>try { var t = localStorage.getItem('tggr-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
  :root { --paper: #f4f5f0; --ink: #15302e; --ink-2: #55615e; --rule: #d3d9d1; --teal: #0b7478; --orange: #a85a0c; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #0f1f1e; --ink: #ece6d6; --ink-2: #a9b3ae; --rule: #2a403d; --teal: #4fc0c6; --orange: #f0a040; color-scheme: dark; } }
  :root[data-theme="dark"] { --paper: #0f1f1e; --ink: #ece6d6; --ink-2: #a9b3ae; --rule: #2a403d; --teal: #4fc0c6; --orange: #f0a040; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 17px/1.6 "Atkinson Hyperlegible Next", system-ui, sans-serif; padding: 32px clamp(16px, 4vw, 48px); }
  main { display: grid; justify-items: center; gap: 18px; text-align: center; max-width: 440px; }
  tggr-logo { display: block; width: 96px; aspect-ratio: 600 / 962; }
  .label { font: 500 13px "Atkinson Hyperlegible Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--orange); margin: 8px 0 0; }
  h1 { font: 600 44px/1.05 "Cormorant Garamond", Georgia, serif; margin: 0; }
  p { margin: 0; color: var(--ink-2); }
  a { font: 500 14px "Atkinson Hyperlegible Mono", monospace; color: var(--teal); }
</style>
</head>
<body>
<main>
  <tggr-logo ring="none" motion="still"></tggr-logo>
  <p class="label">404</p>
  <h1>There is no page at this address</h1>
  <p>It may have moved when the site was rebuilt. The tools are all listed on the front page.</p>
  <a href="/">tggr-lab.github.io</a>
</main>
<script src="/logo-kit/tggr-logo.js"></script>
</body>
</html>
